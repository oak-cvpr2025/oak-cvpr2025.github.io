 d.scenes.forEach((name,k)=>{const b=document.createElement('button');b.type='button';b.textContent=name;b.setAttribute('aria-pressed',String(k===0));b.addEventListener('click',()=>go(k));bar.append(b)});
 meta.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=m.name[0].toUpperCase()+m.name.slice(1);select.append(o)});select.value=style;select.addEventListener('change',()=>{style=Number(select.value);restyle()});
